*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body,#root{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070d;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8f0ff}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.pe{pointer-events:auto}
.glass{background:rgba(10,16,32,.78);border:1px solid rgba(120,170,255,.28);border-radius:12px;backdrop-filter:blur(4px)}
.btn{font:inherit;color:#e8f0ff;background:linear-gradient(#26375f,#18233f);border:1px solid rgba(140,180,255,.45);border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96);filter:brightness(1.3)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.red{background:linear-gradient(#7a1d34,#4a1020);border-color:rgba(255,120,150,.5)}
.btn.gold{background:linear-gradient(#8a6a1a,#55410d);border-color:rgba(255,220,120,.6)}
.btn.sm{padding:7px 10px;font-size:13px}
.bar{height:9px;background:#0b1020;border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.bar>i{display:block;height:100%}
.hp>i{background:linear-gradient(#5be07a,#2aa04a)} .mp>i{background:linear-gradient(#6ab8ff,#2f6fd0)} .xp>i{background:linear-gradient(#e8c24a,#b08a1a)}
.foebar>i{background:linear-gradient(#ff6a6a,#b32a3a)}
.hud{position:absolute;left:10px;top:8px;width:min(230px,44vw);padding:7px 9px;font-size:12px}
.hud .row{display:flex;justify-content:space-between;font-weight:700;margin-bottom:3px}
.obj{margin-top:5px;font-size:11px;color:#ffd98a;line-height:1.25}
.qitems{margin:4px 0 0 10px;color:#e8f0ff;font-size:11.5px;line-height:1.45}.qitems .done{color:#7be08f;text-decoration:line-through;opacity:.8}.qfoot{margin-top:3px;color:#cfd8ea;font-style:italic}
.area{font-size:11px;opacity:.75;margin-bottom:3px}
.topbtns{position:absolute;right:10px;top:8px;display:flex;gap:6px}
.topbtns .btn{padding:8px 11px;font-size:14px}
.abtn{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.abtn.on{background:radial-gradient(#ffe38a,#c9961a);color:#241800;border-color:#fff3c0;box-shadow:0 0 22px rgba(255,214,90,.7)}
.abtn.off{opacity:.28}
.abtn small{font-size:10px;font-weight:800;margin-top:2px;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.joyzone{position:absolute;left:0;bottom:0;width:48%;height:62%;touch-action:none}
.joyhint{position:absolute;left:max(34px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.25);opacity:.7}
.joybase{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08)}
.joyknob{position:fixed;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(160,200,255,.65);border:2px solid #fff}
.dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(760px,96vw);min-height:104px;padding:12px 16px 14px;font-size:clamp(14px,2.4vw,17px);line-height:1.4}

.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@keyframes blink{50%{opacity:.15}}
.banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(rgba(0,0,0,.2),rgba(0,0,0,.7));animation:bn 2.8s ease both}

.fade{position:absolute;inset:0;background:#000;transition:opacity .35s;opacity:0}

@keyframes fl{0%{opacity:.95}100%{opacity:0}}

.tabs .btn{padding:7px 12px;font-size:13px}.tabs .btn.sel{background:linear-gradient(#3b63b8,#274488)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.item small{opacity:.7;display:block;font-size:11px}
.close{position:absolute;right:10px;top:10px}
.tscreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(rgba(5,7,13,.55),rgba(5,7,13,.8));text-align:center}
.tscreen h1{margin:0;font-size:clamp(34px,9vw,76px);letter-spacing:8px;text-shadow:0 0 22px #6cf,0 0 3px #fff}
.tscreen p{margin:0 0 14px;opacity:.8;letter-spacing:3px;font-size:clamp(11px,2.4vw,16px)}
.tscreen .btn{width:min(280px,70vw);font-size:18px;padding:13px}
.tscreen small{opacity:.55;font-size:11px;max-width:80vw;line-height:1.4;margin-top:8px}
.rot{display:none}
@media (orientation:portrait) and (max-width:700px){.rot{display:block;position:absolute;top:56px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.7;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:8px}}
